<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilot Logbook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================================================================
       HEADER
  ================================================================ -->
  <header class="app-header">
    <div class="header-left">
      <span class="header-icon">&#9992;</span>
      <h1>Pilot Logbook</h1>
    </div>
    <div class="header-right">
      <span class="status-label" id="status-label">Connecting…</span>
      <span class="status-dot" id="status-dot"></span>
    </div>
  </header>

  <!-- ================================================================
       ACTIVE FLIGHT BANNER  (hidden when on ground)
  ================================================================ -->
  <div class="active-banner hidden" id="active-banner">
    <div class="banner-row">
      <span class="banner-segment">
        <span class="banner-key">From</span>
        <strong id="b-dep">—</strong>
      </span>
      <span class="banner-arrow">&#10132;</span>
      <span class="banner-segment">
        <span class="banner-key">Aircraft</span>
        <strong id="b-aircraft">—</strong>
      </span>
      <span class="banner-segment">
        <span class="banner-key">Altitude</span>
        <strong id="b-alt">—</strong>
        <span class="banner-unit">ft</span>
      </span>
      <span class="banner-segment">
        <span class="banner-key">Elapsed</span>
        <strong id="b-elapsed">—</strong>
      </span>
    </div>
  </div>

  <!-- ================================================================
       MAIN CONTENT
  ================================================================ -->
  <main class="main-content">

    <!-- Toolbar -->
    <div class="toolbar">
      <span class="toolbar-title">Flight Log</span>
      <span class="flight-count" id="flight-count"></span>
    </div>

    <!-- Logbook table -->
    <div class="table-wrapper">
      <table class="logbook-table" id="logbook-table">
        <thead>
          <tr>
            <th data-col="date"        class="sortable">Date <span class="sort-icon"></span></th>
            <th data-col="aircraft"    class="sortable">Aircraft <span class="sort-icon"></span></th>
            <th data-col="from"        class="sortable">From <span class="sort-icon"></span></th>
            <th data-col="to"          class="sortable">To <span class="sort-icon"></span></th>
            <th data-col="distance_nm" class="sortable num">Dist (nm) <span class="sort-icon"></span></th>
            <th data-col="elapsed"     class="sortable num">Duration <span class="sort-icon"></span></th>
            <th data-col="max_alt"     class="sortable num">Max Alt <span class="sort-icon"></span></th>
            <th data-col="landing_vs"  class="sortable num">Ldg VS <span class="sort-icon"></span></th>
            <th data-col="landing_g"   class="sortable num">Ldg G <span class="sort-icon"></span></th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody id="flight-rows">
          <!-- populated by app.js -->
        </tbody>
      </table>
    </div>

    <!-- Empty state -->
    <div class="empty-state hidden" id="empty-state">
      <span class="empty-icon">&#9992;</span>
      <p>No flights recorded yet.</p>
      <p class="empty-sub">Flights are automatically captured from Microsoft Flight Simulator via SimConnect.</p>
    </div>

  </main>

  <!-- ================================================================
       FLIGHT DETAIL MODAL
  ================================================================ -->
  <div class="modal-overlay hidden" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Flight Detail</span>
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- populated dynamically -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
