<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilot Logbook</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "preact": "./vendor/preact.mjs",
        "preact/hooks": "./vendor/preact-hooks.mjs",
        "htm": "./vendor/htm.mjs"
      }
    }
  </script>
</head>
<body>

  <!-- ================================================================
       APP SHELL  (header, status, active flight banner; rendered by js/app.js)
       display: contents keeps the sticky header scoped to <body>.
  ================================================================ -->
  <div id="app" style="display: contents"></div>

  <!-- ================================================================
       MAIN CONTENT
  ================================================================ -->
  <main class="main-content">

    <!-- Toolbar -->
    <div class="toolbar">
      <span class="toolbar-title">Flight Log</span>
      <span class="flight-count" id="flight-count"></span>
      <button class="btn-export" id="btn-export" type="button" title="Download every flight as a CSV file">Export CSV</button>
    </div>

    <!-- Logbook table -->
    <div class="table-wrapper">
      <table class="logbook-table" id="logbook-table">
        <thead>
          <tr>
            <th data-col="date"        class="sortable">Date <span class="sort-icon"></span></th>
            <th data-col="aircraft"    class="sortable">Aircraft <span class="sort-icon"></span></th>
            <th data-col="from"        class="sortable">From <span class="sort-icon"></span></th>
            <th data-col="to"          class="sortable">To <span class="sort-icon"></span></th>
            <th data-col="distance_nm" class="sortable num">Dist (nm) <span class="sort-icon"></span></th>
            <th data-col="elapsed"     class="sortable num">Duration <span class="sort-icon"></span></th>
            <th data-col="max_alt"     class="sortable num">Max Alt <span class="sort-icon"></span></th>
            <th data-col="landing_vs"  class="sortable num">Ldg VS <span class="sort-icon"></span></th>
            <th data-col="landing_g"   class="sortable num">Ldg G <span class="sort-icon"></span></th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody id="flight-rows">
          <!-- populated by js/main.js -->
        </tbody>
      </table>
    </div>

    <!-- Empty state -->
    <div class="empty-state hidden" id="empty-state">
      <span class="empty-icon">&#9992;</span>
      <p>No flights recorded yet.</p>
      <p class="empty-sub">Flights are automatically captured from Microsoft Flight Simulator via SimConnect.</p>
    </div>

  </main>

  <!-- ================================================================
       FLIGHT DETAIL MODAL
  ================================================================ -->
  <div class="modal-overlay hidden" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Flight Detail</span>
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- populated dynamically -->
      </div>
    </div>
  </div>

  <!-- ================================================================
       SIGN-IN OVERLAY  (shown until a viewer token is saved)
  ================================================================ -->
  <div class="modal-overlay hidden" id="auth-overlay" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="modal auth-modal">
      <div class="modal-header">
        <span class="modal-title" id="auth-title">Sign in</span>
      </div>
      <form class="modal-body auth-form" id="auth-form" autocomplete="off">
        <p class="auth-hint">Enter the viewer token for this logbook. It is kept only in this browser.</p>
        <input type="password" id="auth-token" class="auth-input" placeholder="Viewer token"
               autocomplete="off" spellcheck="false" required>
        <div class="auth-actions">
          <span class="auth-error" id="auth-error" role="alert"></span>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
