<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilot Logbook</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "preact": "./vendor/preact.mjs",
        "preact/hooks": "./vendor/preact-hooks.mjs",
        "htm": "./vendor/htm.mjs"
      }
    }
  </script>
</head>
<body>

  <!-- ================================================================
       APP  (header, status, active flight banner, logbook table and
       detail modal; rendered by js/app.js)
       display: contents keeps the sticky header scoped to <body>.
  ================================================================ -->
  <div id="app" style="display: contents"></div>

  <!-- ================================================================
       SIGN-IN OVERLAY  (shown until a viewer token is saved)
  ================================================================ -->
  <div class="modal-overlay hidden" id="auth-overlay" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="modal auth-modal">
      <div class="modal-header">
        <span class="modal-title" id="auth-title">Sign in</span>
      </div>
      <form class="modal-body auth-form" id="auth-form" autocomplete="off">
        <p class="auth-hint">Enter the viewer token for this logbook. It is kept only in this browser.</p>
        <input type="password" id="auth-token" class="auth-input" placeholder="Viewer token"
               autocomplete="off" spellcheck="false" required>
        <div class="auth-actions">
          <span class="auth-error" id="auth-error" role="alert"></span>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
